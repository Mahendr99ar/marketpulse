name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r app/requirements.txt pytest tabulate
          pip install -e .
      - name: Tests (leakage, fact-checker, models)
        run: pytest -q
      - name: Demo pipeline end to end
        run: python -m marketpulse.cli all --demo
